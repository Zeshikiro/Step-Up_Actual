<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550">
    <rect width="1200" height="550" fill="#050505"/>
    <style>
        .header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; }
        .row-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #EEEEEE; }
        .line { stroke: #1A1A1A; stroke-width: 1; }
        .block { fill: #FFFFFF; }
    </style>

    <line x1="20" y1="50" x2="1180" y2="50" class="line" />

    <!-- Headers -->
    <text x="20" y="35" class="header">Development Phase</text>
    <text x="350" y="35" class="header" text-anchor="middle">Apr 11-20</text>
    <text x="444" y="35" class="header" text-anchor="middle">May 4-10</text>
    <text x="538" y="35" class="header" text-anchor="middle">May 12-17</text>
    <text x="632" y="35" class="header" text-anchor="middle">May 20-24</text>
    <text x="726" y="35" class="header" text-anchor="middle">May 26-29</text>
    <text x="820" y="35" class="header" text-anchor="middle">May 31-Jun 2</text>
    <text x="914" y="35" class="header" text-anchor="middle">Jun 1-12</text>
    <text x="1008" y="35" class="header" text-anchor="middle">Jun 13-20</text>
    <text x="1102" y="35" class="header" text-anchor="middle">Jul 8 onward</text>

    <!-- Row 1 -->
    <line x1="20" y1="100" x2="1180" y2="100" class="line" />
    <text x="20" y="80" class="row-text">UI Foundation and BMI</text>
    <rect x="340" y="70" width="20" height="12" class="block" />

    <!-- Row 2 -->
    <line x1="20" y1="150" x2="1180" y2="150" class="line" />
    <text x="20" y="130" class="row-text">Security and Settings</text>
    <rect x="434" y="120" width="20" height="12" class="block" />

    <!-- Row 3 -->
    <line x1="20" y1="200" x2="1180" y2="200" class="line" />
    <text x="20" y="180" class="row-text">Hardware Pedometer and GPS</text>
    <rect x="528" y="170" width="20" height="12" class="block" />

    <!-- Row 4 -->
    <line x1="20" y1="250" x2="1180" y2="250" class="line" />
    <text x="20" y="230" class="row-text">Gamification: Missions and Leaderboard</text>
    <rect x="622" y="220" width="20" height="12" class="block" />

    <!-- Row 5 -->
    <line x1="20" y1="300" x2="1180" y2="300" class="line" />
    <text x="20" y="280" class="row-text">Avatar Customization Engine</text>
    <rect x="716" y="270" width="20" height="12" class="block" />

    <!-- Row 6 -->
    <line x1="20" y1="350" x2="1180" y2="350" class="line" />
    <text x="20" y="330" class="row-text">Firebase Cloud and Web Application</text>
    <rect x="810" y="320" width="20" height="12" class="block" />

    <!-- Row 7 -->
    <line x1="20" y1="400" x2="1180" y2="400" class="line" />
    <text x="20" y="380" class="row-text">Mapbox and ARCore Integration</text>
    <rect x="904" y="370" width="20" height="12" class="block" />

    <!-- Row 8 -->
    <line x1="20" y1="450" x2="1180" y2="450" class="line" />
    <text x="20" y="430" class="row-text">Location-Based Points of Interest</text>
    <rect x="998" y="420" width="20" height="12" class="block" />

    <!-- Row 9 -->
    <line x1="20" y1="500" x2="1180" y2="500" class="line" />
    <text x="20" y="473" class="row-text">Polishing, Input Overhaul, and</text>
    <text x="20" y="493" class="row-text">Compliance</text>
    <rect x="1092" y="477" width="20" height="12" class="block" />
</svg>
